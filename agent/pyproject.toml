[project]
name = "evaluator-agent"
version = "0.1.0"
description = "The Evaluator — agen evaluator ERC-8183 dengan memori provider yang bisa diaudit"
requires-python = ">=3.13,<3.14"
dependencies = [
    "web3==7.16.0",
    "sibyl-memory-client==0.7.0",
]

# Dependensi pengembangan. Ruff WAJIB ada: scripts/gate.sh menjalankannya begitu
# agent/pyproject.toml muncul.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff",
]

# LAYOUT PAKET (task 2.0/T13): satu paket datar `agent/agent/`, diimpor sebagai `agent.<modul>`
# lewat `pythonpath` di bawah — tanpa `src/`, tanpa build backend, tanpa manipulasi sys.path.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
