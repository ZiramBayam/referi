[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Dipin oleh docs/versions.md — jangan ubah tanpa ADR.
solc = "0.8.36"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

# Hanya BACA `out/`: test_abiJson_* mengunci nama + urutan argumen ABI hasil build. Pertukaran nama
# argumen non-indexed di sebuah event tidak mengubah topic0 maupun hasil abi.decode (Solidity mendekode
# per posisi, bukan per nama), tetapi MENGUBAH ABI JSON yang dipakai watcher web3.py/viem.
fs_permissions = [{ access = "read", path = "./out" }]
